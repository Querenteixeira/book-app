name: Deploy para GitHub Pages

# Publica o app no GitHub Pages a cada push na branch principal.
# Também pode ser disparado manualmente pela aba Actions.
on:
  push:
    branches:
      - main
      - claude/books-series-recommendation-app-89tjh4
  workflow_dispatch:

# Permissões necessárias para o deploy oficial do GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante um deploy por vez, sem cancelar o que já está em produção.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
